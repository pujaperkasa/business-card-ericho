<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Bisnis Digital - Smooth Animation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Preload critical resources -->
    <link rel="preload" href="img/card-front-ericho-agil-nugraha-pt-puja-perkasa.png" as="image">
    <link rel="preload" href="img/card-back-ericho-agil-nugraha-pt-puja-perkasa.png" as="image">
    
    <!-- Tambahkan library untuk generate PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Kartu Bisnis Digital</h1>
        
        <div class="card-container">
            <div class="card" id="businessCard">
                <div class="card-front"></div>
                <div class="card-back"></div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-flip" id="flipBtn">
                <i class="fas fa-sync-alt"></i>
                <span>Lihat Belakang</span>
            </button>
            <button class="btn btn-whatsapp" id="whatsappBtn">
                <i class="fab fa-whatsapp"></i>
                <span>WhatsApp</span>
            </button>
            <button class="btn btn-email" id="emailBtn">
                <i class="fas fa-envelope"></i>
                <span>Email</span>
            </button>
            <button class="btn btn-download" id="downloadBtn">
                <i class="fas fa-download"></i>
                <span>Unduh PDF</span>
            </button>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Memproses...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
